---
job: extension
config:
  name: "my_first_anima_lora_v1"
  process:
    - type: "sd_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/path/to/images/folder"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 1024, 1536]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "linear"
        optimizer: "adamw"
        optimizer_params:
          weight_decay: 0.01
        lr: 2e-5
        dtype: bf16
      model:
        name_or_path: "circlestone-labs/Anima-Base-v1.0-Diffusers"
        arch: "anima"
        quantize: true
        qtype: "qfloat8"
        quantize_te: false
        low_vram: true
        model_kwargs:
          llm_adapter_lr: 0
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        prompts:
          - "masterpiece, best quality, score_7, safe, 1girl, detailed cinematic portrait, soft natural light"
          - "masterpiece, best quality, score_7, safe, 1boy, solo, fantasy adventurer, cloak, sword, glowing forest, dynamic pose, anime key visual"
          - "masterpiece, best quality, score_7, safe, 2girls, cafe, casual clothes, warm lighting, detailed background, slice of life, anime screencap"
          - "masterpiece, best quality, score_7, safe, dragon girl, horns, wings, ornate dress, floating islands, clouds, vibrant colors, anime fantasy art"
        neg: "worst quality, low quality, score_1, score_2, score_3, artist name"
        seed: 42
        walk_seed: true
        guidance_scale: 4.5
        sample_steps: 35
meta:
  name: "[name]"
  version: "1.0"
